name: Android Release APK

on:
  push:
    branches:
      - main
    paths:
      - "android-widget/release-trigger.txt"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-widget

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.6.0"

      - name: Release-Version bestimmen
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < release-trigger.txt)"
          fi
          test -n "$VERSION"
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$APP_VERSION" = "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Prüfe Signing Secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

      - name: Release Keystore bereitstellen
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore

      - name: Keystore und Alias prüfen
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list             -keystore release.keystore             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Signierte Release APK bauen
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-widget/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Release-Dateien vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "Aufgaben-Dashboard-${VERSION}.apk"
          sha256sum "Aufgaben-Dashboard-${VERSION}.apk" > "Aufgaben-Dashboard-${VERSION}.apk.sha256"

      - name: Signierte APK als Build-Artefakt speichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aufgaben-Dashboard-${{ env.VERSION }}-signed
          path: |
            android-widget/Aufgaben-Dashboard-${{ env.VERSION }}.apk
            android-widget/Aufgaben-Dashboard-${{ env.VERSION }}.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: GitHub Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Aufgaben-Dashboard-${VERSION}.apk" \
              "Aufgaben-Dashboard-${VERSION}.apk.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "Aufgaben-Dashboard-${VERSION}.apk" \
              "Aufgaben-Dashboard-${VERSION}.apk.sha256" \
              --target "$GITHUB_SHA" \
              --title "Aufgaben Dashboard ${VERSION}" \
              --generate-notes
          fi
